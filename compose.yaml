services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracely
      POSTGRES_DB: tracely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracely -d tracely"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tracely:${POSTGRES_PASSWORD}@db:5432/tracely
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tracely:${POSTGRES_PASSWORD}@db:5432/tracely
      BIND: 0.0.0.0:5000
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 15s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      - api
volumes:
  postgres_data:
